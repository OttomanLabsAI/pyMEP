title: "Fence\nConfigs"
tooltip: "The list of named fence configurations used by Place New Fence and Update Fence, with Add new / Edit / Remove buttons - Add new and Edit open the configuration EDITOR pre-filled with the existing settings (double-click a row edits it too). Each configuration holds the spacing (mm), whether to place at the line's endpoints, a custom ROTATION in degrees on top of line-aligned (0 follows the line, 90 stands across it, negative turns the other way), the POST family - a searchable list of Generic Models, Columns and Structural Columns - and the FOUNDATION family - Structural Foundations only - placed under every post at the same draped point and rotation. Either family can be '(none)': posts only, foundations only, your choice. The ENDPOINT stations can differ too: untick 'keep them the same' to give the line's two ends their own post + foundation (gate / corner posts, heavier piles). Save changes stores the fields into the picked configuration - changing the Name renames it. Configurations are saved in pyMEP settings, so they survive updates - and Update Fence re-reads them by name, so an edit here re-spaces, re-rotates, re-posts or re-founds its fences on the next update."
author: Fid
