title: "Fence\nConfigs"
tooltip: "Create, edit and delete the named fence configurations used by Place New Fence and Update Fence. Each configuration holds the spacing (mm), whether to place at the line's endpoints, and a custom ROTATION in degrees on top of line-aligned (0 follows the line, 90 stands across it, negative turns the other way). Pick one to load its values, change the fields and Save / update - a NEW name creates a new configuration. Configurations are saved in pyMEP settings, so they survive updates - and Update Fence re-reads them by name, so editing one here re-spaces and re-rotates its fences on the next update."
author: Fid
