title: "Fence\nNetwork"
tooltip: "Model a whole fence layout from its LINES. Draw the layout as model lines using the line styles bound in Fence Configs (each configuration carries a LINE STYLE and its SPACING; the config list's ORDER is the priority). Pick the lines one by one (ESC finishes; a pre-selection is used as-is) and the terrain, confirm the style-to-config mapping - then corners come FIRST and EVERY intersection of the lines is a corner - shared endpoints, mid-line crossings, T-junctions. The incident configuration nearest the TOP of the config list wins the corner (put the impact rated one first) and its END post + foundation stand there; when the winner's endpoint PRIORITY is ticked, other lines TERMINATING at the corner place their OWN end post right next to it on their line, the two end foundation circles TOUCHING at a single point (family 'Diameter' parameters). The in-between posts then fill each stretch at the configuration's spacing, the first touching the nearest circle; a family without a Diameter parameter drops that run back to normal spacing with its first post skipped. Every post is ray-cast onto the terrain like Place New Fence, foundations included. The network is RECORDED, so Update Fence rebuilds it after the lines, the terrain or the configurations change. Revit 2022-2026."
author: Fid
