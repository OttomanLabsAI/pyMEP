title: "Fence\nNetwork"
tooltip: "Model a whole fence layout from its LINES. Draw the layout as model lines using the line styles bound in Fence Configs (each configuration carries a LINE STYLE, its SPACING and a PRIORITY). Pick the lines one by one (ESC finishes; a pre-selection is used as-is) and the terrain, confirm the style-to-config mapping - then shared line endpoints become corner NODES where the incident configuration with the SMALLEST priority number wins (put the impact rated one at 1) and its END post + foundation stand; each line's FIRST post is placed so its foundation circle and the corner end-foundation circle TOUCH at a single point - both diameters read from the families' 'Diameter' parameter - and the rest run at the configuration's spacing. A family without a Diameter parameter drops that line back to normal spacing with its first post skipped. Every post is ray-cast onto the terrain like Place New Fence, foundations included. The network is RECORDED, so Update Fence rebuilds it after the lines, the terrain or the configurations change. Revit 2022-2026."
author: Fid
