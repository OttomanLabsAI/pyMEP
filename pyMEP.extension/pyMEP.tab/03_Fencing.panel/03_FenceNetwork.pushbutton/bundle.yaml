title: "Fence\nNetwork"
tooltip: "Model a whole fence layout from its LINES. Draw the layout as model lines using the line styles bound in Fence Configs (each configuration carries a LINE STYLE, the post + end post DIAMETERS and a PRIORITY). Pick the lines one by one (ESC finishes; a pre-selection is used as-is) and the terrain, confirm the style-to-config mapping - then shared line endpoints become corner NODES where the incident configuration with the SMALLEST priority number wins (put the impact rated one at 1) and its END post + foundation stand; along every line the in-between posts are packed so their circles TOUCH at a single point - the first tangent to the corner post's circle (end diameter), each next tangent to the previous (post diameter), packed from the higher-priority end with the leftover gap reported at the other. Every post is ray-cast onto the terrain like Place New Fence, foundations included. The network is RECORDED, so Update Fence rebuilds it after the lines, the terrain or the configurations change. Revit 2022-2026."
author: Fid
