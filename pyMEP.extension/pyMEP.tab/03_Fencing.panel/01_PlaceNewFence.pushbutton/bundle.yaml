title: "Place New\nFence"
tooltip: "Place the fence configuration's POST + FOUNDATION along a picked LINE, draped onto a picked TERRAIN (toposolid / topography / floor / roof). One dialog first: the fence CONFIGURATION (post family, foundation family, spacing, endpoints, custom rotation - created and edited with the Fence Configs button) and the JUSTIFICATION: Start, Centre or End decides which end of the line the spacing counts from (Centre splits the leftover evenly between both ends). Then pick the line and the terrain in the view; every station is ray-cast straight down onto the picked terrain, the post lands ON the ground rotated to follow the line's direction plus the configuration's rotation, and the foundation (when the config names one) lands under it at the same point and rotation. A configured PANEL family fills each bay between posts - centred, aligned to the line, Width driven to the bay. When the config gives the ENDPOINTS their own families ('keep them the same' unticked), the line's two end stations get those instead. Straight, curved and closed model lines all work (walked by true distance along the curve). The configuration's network-only settings (line style, diameters, priority) are ignored here - one config serves both this button and Fence Network. Every fence is RECORDED (line, terrain, config, each post) in the project file store, so Update Fence re-drapes it after the line, terrain or configuration changes. Revit 2022-2026."
author: Fid
