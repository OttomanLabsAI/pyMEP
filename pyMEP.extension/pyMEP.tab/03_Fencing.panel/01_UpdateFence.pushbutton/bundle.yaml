title: "Update\nFence"
tooltip: "Re-drape recorded fences after the LINE, the TERRAIN or the CONFIGURATION changed - posts AND their foundations. Every fence Place New Fence places is tracked (line, terrain, config name + values, each post's UniqueId + station + rotation). The dialog lists each fence with what WILL happen - move, rebuild, or skip - including any configuration edits about to flow in (Update Fence re-reads the config by NAME, so changes made with Fence Configs re-space and re-rotate the fence). Unchanged station count: every post is MOVED onto the line's current path and the terrain's current surface - element ids survive, and rotation is applied as the DELTA so manual tweaks on a post survive too. Changed count (line reshaped / spacing edited) or a changed foundation: the old posts and foundations are deleted and the fence REBUILT with the current settings. Deleted lines / terrains are reported; a record with no surviving posts is dropped. The registry lives in the project file store (fences.json)."
author: Fid
