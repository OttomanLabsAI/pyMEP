title: "Place New\nFence"
tooltip: "Place a family along a picked LINE, draped onto a picked TERRAIN (toposolid / topography / floor / roof). One dialog first: the family to place (searchable list), the fence CONFIGURATION (spacing, endpoints and custom rotation - created and edited with the Fence Configs button), and the JUSTIFICATION: Start, Centre or End decides which end of the line the spacing counts from (Centre splits the leftover evenly between both ends). Then pick the line and the terrain in the view; every station is ray-cast straight down onto the picked terrain, the instance lands ON the ground at that point, rotated to follow the line's direction plus the configuration's rotation. Straight, curved and closed model lines all work (walked by true distance along the curve). Every fence is RECORDED (line, terrain, config, each post) in the project file store, so Update Fence re-drapes it after the line, terrain or configuration changes. Revit 2022-2026."
author: Fid
