title: "Connect Inflow\nto Collector"
tooltip: "Connect node families into the collector pipes. THE COLLECTOR FINDS ITSELF: a candidate pipe DIRECTLY UNDER a node takes the drop straight down; otherwise the single ray along the node's drawn ARROW picks the first candidate it meets (plan-nearest as the last resort) - the dialog's 'Pipes workset' chooses which pipes are candidates. Pre-select nodes to connect exactly those; select NOTHING and the dialog's CATEGORY > FAMILY > TYPE cascade (or search) plus the 'Node workset' filter choose every placed, still-unconnected node of that type. Pre-select ONE pipe with the nodes to FORCE it as every branch's collector (that also unlocks resize / re-grade of the main). Each branch: a drop from the node's centre (or outlet connector), the 1:n run, and a TEE JUNCTION - oblique aims square their last bit so the tee always places; 'Drop Pipe' unticked grades first and drops last. Diameter from the family parameter YOU pick (or the outlet connector), snapped to routing sizes; branch type and system default to the main's. One undo step; every branch is tracked for Sync Input Nodes."
