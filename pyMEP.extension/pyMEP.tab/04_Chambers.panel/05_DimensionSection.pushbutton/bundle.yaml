title: |-
  Dimension
  Section
tooltip: >-
  Two chained dimensions through the pipe / conduit / duct centrelines in a
  chamber section: the column spacing above the bank and the row spacing to
  its left, one reference per column and per row. From a section view it
  does that view; from a sheet or anywhere else a dialog offers the sections
  (the open sheet's, or the whole project's) and the dimension type.
