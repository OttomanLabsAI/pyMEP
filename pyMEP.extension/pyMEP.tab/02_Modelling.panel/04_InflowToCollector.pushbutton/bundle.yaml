title: "Inflow Drop Pipe\nto Collector"
tooltip: "Select (or pick) the collector pipe and choose the NODES: pre-select node instances with the pipe (or pick them when prompted) to connect exactly those - any mix of types - or finish the pick empty and choose a family by CATEGORY > FAMILY > TYPE (or search) to connect every placed, still-unconnected node of that type. Each node gets a drop pipe from its outlet (diameter from the family parameter YOU pick - or the outlet connector - snapped to the main type's routing sizes), a bend, a run falling at 1:n to meet the main as it lies, and a TEE JUNCTION into the main; the dialog can also RESIZE the main, re-grade it at its own 1:n (keeping the upper or lower end as is), fix the branch diameter, pick the branch pipe type and system (defaulting to the main's), and pin the upstream invert. Everything models in one go (a single undo step). Already-connected nodes are left alone; branches take the main's pipe type, system type and level. Family type and gradient are remembered between runs."
