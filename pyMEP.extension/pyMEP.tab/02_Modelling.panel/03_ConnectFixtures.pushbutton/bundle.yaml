title: "Connect\nFixtures"
tooltip: "Select ONE main pipe and any number of plumbing fixtures: each fixture gets a vertical downpipe from its outlet connector, an elbow, a sloped branch falling at the chosen 1:n ratio toward the main, and a takeoff fitting where it meets it. One dialog drives it - branch diameter (default: the fixture outlet size, snapped to the main type's routing sizes), the slope ratio, and the upstream invert, which by default stays where the model currently puts it (the branch meets the main as it lies); type an absolute level to fix it instead. Branches take the main's pipe type, system type and level. Diameter and slope are remembered between runs."
