title: "Connect\nFixtures"
tooltip: "Select ONE main pipe and any number of plumbing fixtures: each fixture gets a vertical downpipe from its outlet connector, an elbow, a sloped branch falling at the chosen 1:n ratio toward the main, and a TEE JUNCTION where it meets it (the main is split at the branch point and the halves + branch joined with a tee; a takeoff is only the reported fallback). One dialog drives it - branch diameter (default: the fixture outlet size, snapped to the main type's routing sizes), the branch slope ratio, optionally re-grading the MAIN at its own 1:n first (low end stays put; prefilled with its current gradient), and the upstream invert, which by default stays where the model currently puts it; type an absolute level to fix it instead. Branches take the main's pipe type, system type and level. Diameter and slope are remembered between runs."
