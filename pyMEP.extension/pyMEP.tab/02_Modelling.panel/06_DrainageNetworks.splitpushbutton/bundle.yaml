title: "Drainage\nNetworks"
tooltip: >-
  The drainage networks 3D dashboard. Scans every placed family whose
  FAMILY name contains a word you choose (default "node"), groups the
  instances into networks by their type name (e.g. STORMWATER - IN -
  N1) and opens them - nodes, tracked branches and their mains - in a
  3D viewer. Select a network there to edit branch/main sizes,
  gradients, worksets and a main end's invert level; Save downloads an
  edits file and the dropdown's "Apply Dashboard Edits" adapts the
  model to it. Rebuilt from the model on every launch, so running
  Nodes to Main populates it automatically.
