title: "Update\nNodes"
tooltip: "Adapt the tracked node branches to where the nodes are NOW. Every branch Inflow Drop Pipe to Collector builds is tracked in the project's file store; hit this after moving or deleting nodes - moved nodes get their old branch deleted, the main healed across the old tee, and the branch rebuilt with the same settings against the main as it now lies; deleted nodes get their branch removed. Unmoved nodes are left alone. One undo step."
