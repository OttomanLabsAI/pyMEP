title: "Import Project\nData"
tooltip: "Pick a JSON written by Export Project Data; one sectioned dialog chooses what comes in. Sections today: VIEW TEMPLATES and FILTERS - each has a Select button (the template picker filters by view family), a tick deciding whether the section imports, and the dialog carries the update-or-skip choice for existing same-name items. Filters import first, then templates; same-name items are UPDATED IN PLACE (views keep their template assignment) - never deleted and recreated - and importing the same file twice is idempotent. Sections / elevations need one existing view of that family as the donor. Every anomaly (missing pattern, unmatched level, unknown parameter, missing subcategory) lands in the summary table as skipped or degraded with its reason."
