title: "Import Project\nData"
tooltip: "Pick a JSON written by Export Project Data; one sectioned dialog chooses what comes in. Sections: VIEW TEMPLATES, FILTERS, LEVELS, FILL PATTERNS, LINE PATTERNS and LINE STYLES - each has a Select button, a tick deciding whether the section imports, a Tick-EVERYTHING button for the whole file in one click, the update-or-skip choice for existing same-name items, and a DRY pre-flight box listing what cannot import cleanly right now. Import order fixes the degrade causes: patterns first, then levels, then filters, then templates; same-name items are UPDATED IN PLACE (views keep their template assignment) - never deleted and recreated - and importing the same file twice is idempotent. Sections / elevations need one existing view of that family as the donor. Every anomaly (missing pattern, unmatched level, unknown parameter, missing subcategory) lands in the summary table as skipped or degraded with its reason."
