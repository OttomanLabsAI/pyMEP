title: "Export Project\nData"
tooltip: "One sectioned dialog writes picked project data to a version-agnostic JSON file. Sections today: VIEW TEMPLATES and FILTERS - each has a Select button (the template picker filters by view family: floor plan, 3D, section, ...) and a tick deciding whether that section goes to the file. Filters referenced by the chosen templates travel with them automatically while the filters section is ticked. Everything serializes by NAME, never by element id - nested AND/OR rules, inverted rules, shared/project parameters, category visibility and graphic overrides, filter overrides, view range, phase filter, controlled-parameter scope. The JSON crosses Revit versions (2022-2026), diffs cleanly in git and can be hand-edited. Selection filters cannot cross models and are reported skipped."
