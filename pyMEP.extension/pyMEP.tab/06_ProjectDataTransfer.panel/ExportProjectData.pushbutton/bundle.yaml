title: "Export Project\nData"
tooltip: "One sectioned dialog writes picked project data to a version-agnostic JSON file. Sections: VIEW TEMPLATES, FILTERS, LEVELS, FILL PATTERNS and LINE PATTERNS - each has a Select button (the template picker filters by view family, the fill pattern picker by Drafting / Model) and a tick deciding whether that section goes to the file. Filters referenced by the chosen templates travel with them automatically while the auto tick is on; exporting levels and patterns lets the import rebuild them FIRST so view ranges and overrides land without degrading. Everything serializes by NAME, never by element id - nested AND/OR rules, inverted rules, shared/project parameters, category visibility and graphic overrides, filter overrides, view range, phase filter, controlled-parameter scope. The JSON crosses Revit versions (2022-2026), diffs cleanly in git and can be hand-edited. Selection filters cannot cross models and are reported skipped."
