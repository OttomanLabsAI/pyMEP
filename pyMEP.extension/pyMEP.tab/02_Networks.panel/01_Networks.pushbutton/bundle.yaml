title: Drainage
tooltip: "Launch the drainage networks 3D dashboard: every placed family whose family name contains the Network Settings filter word (default 'node'), grouped BY COLLECTOR - type names carry just system and flow (e.g. STORMWATER - IN) and each collector run gets its own automatic identity (STORMWATER - IN - C1, C2, ...) carried in the pyMEP_Network parameter. Select a network in the dashboard to edit sizes, gradients, worksets and main end inverts, then Save the edits file for Apply Edits. Rebuilt from the model on every launch."
