title: Apply Edits
tooltip: "One-click update from the Networks dashboard: applies the newest pymep_network_edits.json (the dashboard keeps that one file up to date as you edit) - resize/re-grade mains, set a main end's invert, move worksets, rebuild the tracked branches to match, one undo step. Each dashboard save is stamped and remembered, so the same save never applies twice; looks in the folder set in Network Settings (default: Downloads)."
