title: "Import View\nTemplates"
tooltip: "Read a JSON written by Export View Templates, pick which templates / filters to bring in, and recreate or update them in the active model. Filters import first, then templates; a same-name item is UPDATED IN PLACE (views keep their template assignment) or skipped - your choice up front - never deleted and recreated. Sections / elevations need one existing view of that family as the donor. Every anomaly (missing fill or line pattern, unmatched level, unknown parameter, missing subcategory) lands in the summary table as skipped or degraded with its reason - one broken item never aborts the run. Importing the same file twice is idempotent."
