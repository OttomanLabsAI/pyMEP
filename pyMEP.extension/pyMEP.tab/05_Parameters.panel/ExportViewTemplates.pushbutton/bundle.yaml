title: "Export View\nTemplates"
tooltip: "Write picked view templates - and optionally standalone rule-based filters - to ONE version-agnostic JSON file. Filters referenced by the picked templates are included automatically. The JSON crosses Revit versions (export from 2025, import into 2022), diffs cleanly in git and can be hand-edited: filter rules (nested AND/OR, inverted, shared/project parameters), category visibility and graphic overrides, filter overrides, view range, phase filter and the controlled-parameter scope all serialize by NAME, never by element id. Selection filters cannot cross models and are reported skipped."
