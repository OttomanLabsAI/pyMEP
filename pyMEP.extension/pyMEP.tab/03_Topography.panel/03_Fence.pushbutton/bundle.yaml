title: "Fence"
tooltip: "Place a family along a picked LINE, draped onto a picked TERRAIN (toposolid / topography / floor / roof). One dialog first: the family to place (searchable list), a named spacing CONFIGURATION - spacing in mm plus a place-at-the-endpoints tick, with create / edit / delete so different fence set-ups are one dropdown away - and the JUSTIFICATION: Start, Centre or End decides which end of the line the spacing counts from (Centre splits the leftover evenly between both ends). Then pick the line and the terrain in the view; every station is ray-cast straight down onto the picked terrain, the instance lands ON the ground at that point, and it is rotated so its X axis follows the line's direction there. Straight, curved and closed model lines all work (walked by true distance along the curve). Every fence is RECORDED (line, terrain, settings, each post) in the project file store, so Update Fence re-drapes it after the line or terrain changes. Configurations are saved in pyMEP settings and survive updates. Revit 2022-2026."
author: Fid
