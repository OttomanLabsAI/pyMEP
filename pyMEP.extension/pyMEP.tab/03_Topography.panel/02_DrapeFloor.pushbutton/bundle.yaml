title: "Drape Floor\nto Topo"
tooltip: "Drape the selected floors onto the Toposolid / Topography below (host model or links). One dialog drives it: sample the sketch boundary at a typed spacing - or tick 'Existing corners ONLY' to drape just the sketch's own corner points - plus an optional interior grid with its OWN X and Y spacings ('match edges' ties X to the edge spacing, 'match X' ties Y to X). Every sample is ray-cast straight down onto terrain and each hit is added as a slab-shape point so the floor follows the ground (up or down); openings are respected. Complex footpath-style floors work: curved and full-circle edges are sampled at the spacing along their length, and boundary points the slab rejects on curved edges are retried slightly inward. The dialog also picks WHICH terrain: every toposolid / topography in the host model and links, or one chosen surface - and whether the TOPMOST or the LOWEST surface wins where they stack. Select the floors first, or click with nothing selected and pick them ONE BY ONE in the view - a single ESC (or right-click) continues with what you picked, no options-bar Finish. Every choice is remembered between runs. Revit 2022-2026."
author: Fid
