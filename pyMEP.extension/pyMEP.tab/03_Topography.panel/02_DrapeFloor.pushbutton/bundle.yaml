title: "Drape Floor\nto Topo"
tooltip: "Drape the selected floors onto the Toposolid / Topography below (host model or links). Samples the floor's sketch boundary at the spacing you type - plus an optional interior grid at the same spacing - ray-casts straight down onto terrain, and adds every hit as a slab-shape point so the floor follows the ground. Floors with openings are handled (hole loops respected in the grid). Select the floors first, or click with nothing selected and pick them in the view; spacing and edges/grid choice are remembered between runs. Revit 2022-2026."
author: Fid
