title: "Drape Floor\nto Topo"
tooltip: "Drape the selected floors onto the Toposolid / Topography below (host model or links). One dialog drives it: sample the sketch boundary at a typed spacing - or tick 'Existing corners ONLY' to drape just the sketch's own corner points - plus an optional interior grid with its OWN X and Y spacings ('match X' keeps them equal). Every sample is ray-cast straight down onto terrain and each hit is added as a slab-shape point so the floor follows the ground; openings are respected. Select the floors first, or click with nothing selected and pick them in the view; every choice is remembered between runs. Revit 2022-2026."
author: Fid
